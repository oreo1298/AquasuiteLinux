name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          aquactl --version && aquactl --help > /dev/null
          aquactl --demo status
          aquasuited --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check aquasuitelinux tests tools

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Build and install the Arch package
        run: |
          pacman -Syu --noconfirm --needed git python pyside6 qt6-svg python-build python-installer \
            python-setuptools python-wheel python-pytest
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --noconfirm"
          pacman -U --noconfirm "$GITHUB_WORKSPACE"/aquasuitelinux-*.pkg.tar.zst
          aquactl --version
          aquactl --demo status
          QT_QPA_PLATFORM=offscreen python -c "import aquasuitelinux.gui.main_window; print('import OK')"
