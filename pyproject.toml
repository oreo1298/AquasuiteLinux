[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasuitelinux"
version = "1.0.5"
description = "Monitoring and fan control for Aquacomputer devices on Linux: fan curves, Delta T, alarms, aquasuite import"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AquasuiteLinux contributors" }]
keywords = ["Aquacomputer", "aquasuite", "QUADRO", "OCTO", "D5 NEXT", "aquaero", "fan control", "water cooling",
            "hwmon", "hidraw"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]
# The core, the service and the CLI use only the standard library. The GUI needs PySide6
# (from your distribution, or the "gui" extra).
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]
dev = ["pytest>=7", "PySide6-Essentials>=6.5", "ruff"]

[project.scripts]
aquactl = "aquasuitelinux.cli:main"
aquasuited = "aquasuitelinux.core.service:main"

[project.gui-scripts]
aquasuitelinux = "aquasuitelinux.gui.app:main"

[project.urls]
Homepage = "https://github.com/oreo1298/AquasuiteLinux"
Repository = "https://github.com/oreo1298/AquasuiteLinux"
Issues = "https://github.com/oreo1298/AquasuiteLinux/issues"

[tool.setuptools.packages.find]
include = ["aquasuitelinux*"]

[tool.setuptools.package-data]
aquasuitelinux = ["data/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 long lines, E741 ambiguous names
ignore = ["E501", "E741"]
